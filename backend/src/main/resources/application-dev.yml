# Dev profile — local Windows-native PostgreSQL on localhost:5432
# (SPEC §1, "no mock mode").
#
# Connects to database `bpl_dev` as the non-superuser role `bpl_app`.
# The password is NOT defaulted here — supply it via the DB_PASSWORD
# environment variable.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bpl_dev}
    username: ${DB_USER:bpl_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  session:
    jdbc:
      initialize-schema: never
    timeout: 8h
    cookie:
      # DEVIATION from SPEC §8.1's "Secure (prod)" rule: dev runs over
      # plain HTTP, so a Secure cookie would be rejected by the browser.
      # application-prod.yml sets secure: true.
      secure: false
      http-only: true
      same-site: strict
      path: /
  cors:
    allowed-origins: "http://localhost:5173"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

# SSH credential encryption key (SPEC §8.3). 32+ char master key.
# No default — set SSH_CIPHER_KEY in the dev shell.
ssh:
  cipher:
    key: ${SSH_CIPHER_KEY:}

server:
  port: 8080

# WebSocket connection limits (SPEC §5.4)
websocket:
  max-per-user: 5
  max-per-application: 50
  max-global: 500
