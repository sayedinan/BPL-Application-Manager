# Dev profile — local SQLite file (SPEC §1, "no mock mode").
#
# The database is a single file, ./data/bpl.db by default (override with
# DB_PATH). Pragmas are set per connection through the JDBC URL:
#   foreign_keys=on        cascades only work when this is on, per connection
#   journal_mode=WAL       readers do not block the writer
#   busy_timeout=10000     wait up to 10 s for the write lock
#   synchronous=NORMAL     safe with WAL
#   transaction_mode=IMMEDIATE  take the write lock at BEGIN (no read->write upgrade failures)
# No username or password: SQLite has none.

spring:
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/bpl.db}?foreign_keys=on&busy_timeout=10000&journal_mode=WAL&synchronous=NORMAL&transaction_mode=IMMEDIATE
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # Must be larger than busy_timeout (10 s).
      connection-timeout: 15000
  jpa:
    hibernate:
      # Schema validation is unreliable on SQLite; Flyway plus tests are the guard.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  session:
    jdbc:
      initialize-schema: never
    timeout: 8h
    cookie:
      # DEVIATION from SPEC §8.1's "Secure (prod)" rule: dev runs over
      # plain HTTP, so a Secure cookie would be rejected by the browser.
      # application-prod.yml sets secure: true.
      secure: false
      http-only: true
      same-site: strict
      path: /
  cors:
    allowed-origins: "http://localhost:5173"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

# SSH credential encryption key (SPEC §8.3). 32+ char master key.
# No default — set SSH_CIPHER_KEY in the dev shell.
ssh:
  cipher:
    key: ${SSH_CIPHER_KEY:}

server:
  port: 8080

# WebSocket connection limits (SPEC §5.4)
websocket:
  max-per-user: 10
  max-per-application: 50
  max-global: 500
