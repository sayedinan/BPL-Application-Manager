# Prod profile — matches SPEC §13.1 verbatim. Secrets (SSH_CIPHER_KEY,
# etc.) and DB_PATH are injected from the environment.
server:
  port: 8443
  ssl:
    enabled: true
    protocol: TLSv1.3

spring:
  datasource:
    # DB_PATH has no default on purpose: prod fails fast if it is unset.
    # Pragma meanings are documented in application-dev.yml.
    url: jdbc:sqlite:${DB_PATH}?foreign_keys=on&busy_timeout=10000&journal_mode=WAL&synchronous=NORMAL&transaction_mode=IMMEDIATE
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # Must be larger than busy_timeout (10 s).
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  session:
    jdbc:
      initialize-schema: never
    timeout: 8h
    cookie:
      secure: true
      http-only: true
      same-site: strict
      path: /
  cors:
    allowed-origins: "${CORS_ORIGIN}"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

# Nightly SQLite backups (VACUUM INTO) go here; compose mounts the bplBackups volume.
app:
  # The first Sys.Admin's password is written here once, on the first start.
  bootstrap:
    sysadmin:
      password-file: ${ADMIN_PASSWORD_FILE:/data/initial-admin-password.txt}
  backup:
    dir: ${BACKUP_DIR:/backups}
    retention-days: 14

# SSH credential encryption key (SPEC §8.3). 32+ char master key from
# the secrets manager. No default — fail fast if SSH_CIPHER_KEY is
# unset in the environment.
ssh:
  cipher:
    key: ${SSH_CIPHER_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  # A real JSON encoder: it escapes quotes and line breaks in messages, which
  # a hand-built pattern does not.
  structured:
    format:
      console: logstash

# WebSocket connection limits (SPEC §5.4)
websocket:
  max-per-user: 10
  max-per-application: 50
  max-global: 500
