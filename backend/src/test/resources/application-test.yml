# Test profile — used by @ActiveProfiles("test") in integration tests.
# Each context gets its own temp-file SQLite database and Flyway runs the
# real baseline, so tests exercise the production schema. Do not use
# `:memory:` with a connection pool: every pooled connection would get its
# own empty database.
spring:
  datasource:
    url: jdbc:sqlite:${java.io.tmpdir}/bpl-test-${random.uuid}.db?foreign_keys=on&busy_timeout=10000&journal_mode=WAL&synchronous=NORMAL&transaction_mode=IMMEDIATE
    hikari:
      maximum-pool-size: 5
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never

# SSH credential encryption key (SPEC §8.3). 32+ char master key.
# Tests set SSH_CIPHER_KEY via the gradle build (see build.gradle.kts
# test block). The cipher bean must not be constructible from a
# committed default — a hardcoded key in source control is exactly
# the regression this config avoids.
ssh:
  cipher:
    key: ${SSH_CIPHER_KEY:}

websocket:
  max-per-user: 5
  max-per-application: 50
  max-global: 500
